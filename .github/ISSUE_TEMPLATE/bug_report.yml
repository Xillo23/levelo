name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Levelo version
      description: Shown at the bottom right of the panel (e.g. v0.9.0 beta)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: input
    id: audio
    attributes:
      label: Audio output and app
      description: Speakers/headphones/HDMI/Bluetooth, and the app playing sound (Netflix in Chrome, VLC…)
